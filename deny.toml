[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0",
  "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense", "BSL-1.0", "OpenSSL",
]

[bans]
multiple-versions = "allow"

# The architectural boundary, enforced rather than trusted: the domain crate
# must never learn about the UI framework.
[[bans.deny]]
name = "tauri"
wrappers = []
deny-multiple-versions = false
