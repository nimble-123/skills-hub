[workspace]
members = ["crates/core", "crates/cli", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nimble-123/skills-hub"
authors = ["skills-hub contributors"]

[workspace.dependencies]
skills-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

blake3 = "1.8"
dirs = "7"
dunce = "1.0"
jiff = { version = "0.2", features = ["serde"] }
rayon = "1.12"
similar = { version = "3.2", features = ["text", "inline"] }
tempfile = "3"
trash = "5"
wait-timeout = "0.2"
walkdir = "2.5"

specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
