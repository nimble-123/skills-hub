[package]
name = "skills-hub"
description = "Browse, tag and toggle AI coding-tool skills, agents, commands and rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "skills_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
skills-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
rayon = { workspace = true }
jiff = { workspace = true }
walkdir = { workspace = true }
specta = { workspace = true }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"

# The menubar companion is macOS-only: NSPanel is what gives a webview real
# menubar behaviour, and there is no equivalent to port.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

[lints]
workspace = true
