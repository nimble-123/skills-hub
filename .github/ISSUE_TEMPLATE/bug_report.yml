name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true

  - type: dropdown
    id: files
    attributes:
      label: Did it change files on disk?
      description: Skills Hub moves and links real files, so this decides how urgent it is.
      options:
        - "No"
        - Yes, as expected
        - Yes, unexpectedly (moved, overwritten or lost)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The line at the foot of the sidebar.
      placeholder: v0.5.0 · 53580a7
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed through
      options:
        - Homebrew
        - winget
        - A download from GitHub Releases
        - Built from source

  - type: input
    id: tool
    attributes:
      label: AI tool involved
      description: If the problem is with one tool's folder, which one.
      placeholder: Claude Code, Cursor, Codex …

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Pasted as text, not a screenshot. Remove anything private.
      render: shell
