# With squash merges, the pull request title becomes the commit message on
# main — and that message is what release-please reads to decide the next
# version and write the changelog. So the title is checked the same way a
# commit message is.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|build|test|ci|chore|style|revert)(\([a-z0-9.-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "ok: $TITLE"
            exit 0
          fi
          cat >&2 <<MSG
          The pull request title is not a Conventional Commit:

              $TITLE

          It becomes the commit message on main, and release-please reads it to
          work out the next version. Use one of:

              feat(scan): …     a new capability          → bumps the minor
              fix(toggle): …    a defect repaired         → bumps the patch
              feat!: …          a breaking change         → bumps the minor while < 1.0
              docs: …  refactor: …  perf: …  build: …  ci: …  chore: …  test: …

          The scope in brackets is optional and lower case.
          MSG
          exit 1
