# Cutting a release is merging a pull request.
#
# release-please keeps one open PR that accumulates every Conventional Commit
# landed on main, writes the changelog and bumps the version everywhere it is
# recorded. Merging that PR tags the commit and publishes the release; the
# bundles are built and attached to it straight after.
#
# The release is deliberately not held back as a draft until its bundles are
# there. A draft creates no git tag, and release-please reads the tags to know
# what has been released — so the window between creating and publishing left
# it computing the next version against a tag that did not exist yet, and the
# same changelog came out twice. A few minutes of a release without downloads
# is the cheaper problem.
name: Release

on:
  push:
    branches: [main]
  # So a release that got stuck can be driven again by hand, without an empty
  # commit to main just to produce a push event.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Asked for rather than assumed: the branch carries the package name as a
      # component, so it is not simply "release-please--branches--main".
      pr_branch: >-
        ${{ steps.release.outputs.pr != ''
            && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Release pull requests are then authored by a real account, and
          # their workflow runs are not held at action_required. Falls back to
          # GITHUB_TOKEN when the secret is absent.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Cargo.lock records the three workspace crates' versions too, and it is a
  # generated file — it cannot carry the annotation comment release-please
  # would need to update it. So the release PR updates it itself. Left undone,
  # a fresh clone would rewrite the lock on its first build and hand whoever
  # cloned it a dirty worktree.
  lockfile:
    name: Sync Cargo.lock
    needs: prepare
    if: needs.prepare.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # release-please force-pushes this branch on every run. A commit added
          # here that a later run overwrites is simply made again by the next one.
          ref: ${{ needs.prepare.outputs.pr_branch }}
          # The same token release-please opens the pull request with. Pushing
          # as github-actions[bot] instead would re-trigger the pull request's
          # workflows as a bot, and those runs are held at action_required —
          # undoing on the sync commit exactly what the token achieves for the
          # pull request itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update --workspace
      - name: Commit if it moved
        run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock" Cargo.lock
          git push

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: a Homebrew cask
          # then needs no on_arm/on_intel split.
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # No ref needed: on a push event the default checkout is already the
      # commit release-please just released.
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Apple silicon and Intel targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - run: pnpm install --frozen-lockfile
      # Signing is deliberately not wired up. Passing the Apple variables as
      # empty strings is not the same as leaving them out: Tauri then tries to
      # import a certificate that is not there and the macOS bundle fails with
      # "failed to import keychain certificate". Add them back together with a
      # real Developer ID certificate, not before.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  # The two package managers read what `bundle` just attached to the release,
  # so neither can start before it has. Both want a token this repository does
  # not have by default; until the secret is set they warn and stop rather than
  # fail, because a secret that has not been created yet is a setting, not a
  # broken release. CONTRIBUTING.md says which token each one wants.
  homebrew:
    name: Homebrew tap
    needs: [prepare, bundle]
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Is the tap token there?
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is unset - the cask in nimble-123/homebrew-tap still points at the previous release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # The cask lives in the tap, which is where Homebrew looks for it. Only
      # the two lines that move on a release are rewritten here.
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
        with:
          repository: nimble-123/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the cask at the released DMG
        if: steps.token.outputs.present == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          dmg="skills-hub_${version}_universal.dmg"
          # The asset appears when the macOS bundle job uploads it. The retries
          # cover the seconds in which the release exists and the file does not.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$dmg" "https://github.com/${REPO}/releases/download/${TAG}/${dmg}"
          sha="$(sha256sum "$dmg" | cut -d' ' -f1)"
          rm "$dmg"
          sed -i "s|^  version \".*\"$|  version \"${version}\"|" Casks/skills-hub.rb
          sed -i "s|^  sha256 \".*\"$|  sha256 \"${sha}\"|" Casks/skills-hub.rb
          # A sed that matched nothing leaves the cask on the old build and
          # says nothing about it, so read back what was meant to be written.
          grep -qxF "  version \"${version}\"" Casks/skills-hub.rb
          grep -qxF "  sha256 \"${sha}\"" Casks/skills-hub.rb
      - name: Commit if it moved
        if: steps.token.outputs.present == 'true'
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: skills-hub ${TAG}" Casks/skills-hub.rb
          git push
        env:
          TAG: ${{ needs.prepare.outputs.tag_name }}

  # Switched off for now: the action refuses to run until microsoft/winget-pkgs
  # carries at least one version of nimble-123.skills-hub, and the first manifest
  # pull request is not merged yet. Once it is, restore the condition below
  # (`if: needs.prepare.outputs.release_created == 'true'`) in place of `false`.
  winget:
    name: winget manifest
    needs: [prepare, bundle]
    if: false && needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Is the winget token there?
        id: token
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::WINGET_TOKEN is unset - no manifest pull request was opened against microsoft/winget-pkgs."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # This only bumps a package winget-pkgs already knows; the first manifest
      # was submitted by hand. No copy of it is kept here on purpose - the
      # action reads the installer itself and rewrites the manifest from what
      # it finds, so a template in this repository would only go stale.
      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.token.outputs.present == 'true'
        with:
          identifier: nimble-123.skills-hub
          release-tag: ${{ needs.prepare.outputs.tag_name }}
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
