# Cutting a release is merging a pull request.
#
# release-please keeps one open PR that accumulates every Conventional Commit
# landed on main, writes the changelog and bumps the version everywhere it is
# recorded. Merging that PR tags the commit and creates a *draft* release; the
# bundles are built and attached to it, and only then is it published — so a
# release is never visible without the downloads it promises.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Asked for rather than assumed: the branch carries the package name as a
      # component, so it is not simply "release-please--branches--main".
      pr_branch: >-
        ${{ steps.release.outputs.pr != ''
            && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Cargo.lock records the three workspace crates' versions too, and it is a
  # generated file — it cannot carry the annotation comment release-please
  # would need to update it. So the release PR updates it itself. Left undone,
  # a fresh clone would rewrite the lock on its first build and hand whoever
  # cloned it a dirty worktree.
  lockfile:
    name: Sync Cargo.lock
    needs: prepare
    if: needs.prepare.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # release-please force-pushes this branch on every run. A commit added
          # here that a later run overwrites is simply made again by the next one.
          ref: ${{ needs.prepare.outputs.pr_branch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update --workspace
      - name: Commit if it moved
        run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock" Cargo.lock
          git push

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: a Homebrew cask
          # then needs no on_arm/on_intel split.
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Apple silicon and Intel targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset until there is an Apple Developer account; Tauri skips
          # signing and notarisation when the identity is empty.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: [prepare, bundle]
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag_name }}" --draft=false --repo "$GITHUB_REPOSITORY"
