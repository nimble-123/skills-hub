# Cutting a release is merging a pull request.
#
# release-please keeps one open PR that accumulates every Conventional Commit
# landed on main, writes the changelog and bumps the version everywhere it is
# recorded. Merging that PR tags the commit and creates a *draft* release; the
# bundles are built and attached to it, and only then is it published — so a
# release is never visible without the downloads it promises.
name: Release

on:
  push:
    branches: [main]
  # So a release that got stuck can be driven again by hand, without an empty
  # commit to main just to produce a push event.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.cut.outputs.created }}
      release_id: ${{ steps.cut.outputs.id }}
      tag_name: ${{ steps.cut.outputs.tag }}
      pr_branch: >-
        ${{ steps.release.outputs.pr != ''
            && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - name: Say which token is in use
        run: |
          if [ -z "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is empty or unset — falling back to GITHUB_TOKEN."
          else
            echo "Using RELEASE_PLEASE_TOKEN."
          fi

      # Only the pull request. Cutting the release is done below, because
      # release-please creates it with target_commitish set to the release
      # commit, and GitHub answers that with 404 for a classic token even
      # though the very same token may create the tag ref and may create a
      # release without that field. Both halves are proven; this uses them.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@v5

      # The manifest holds the version that has been released. If no tag
      # carries it yet, this push is the one that merged the release pull
      # request, and the release is cut here.
      - name: Cut the release if the manifest moved ahead of the tags
        id: cut
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          version=$(jq -r '.["."]' .release-please-manifest.json)
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to cut."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md)

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --jq '.ref'

          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="$tag" -f name="$tag" -f body="$notes" \
                 -F draft=true -F prerelease=false --jq '.id')

          echo "cut $tag as draft release $id"
          {
            echo "created=true"
            echo "id=$id"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  # Cargo.lock records the three workspace crates' versions too, and it is a
  # generated file — it cannot carry the annotation comment release-please
  # would need to update it. So the release PR updates it itself. Left undone,
  # a fresh clone would rewrite the lock on its first build and hand whoever
  # cloned it a dirty worktree.
  lockfile:
    name: Sync Cargo.lock
    needs: prepare
    if: needs.prepare.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # release-please force-pushes this branch on every run. A commit added
          # here that a later run overwrites is simply made again by the next one.
          ref: ${{ needs.prepare.outputs.pr_branch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update --workspace
      - name: Commit if it moved
        run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock" Cargo.lock
          git push

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: a Homebrew cask
          # then needs no on_arm/on_intel split.
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # No ref: a draft release does not create the git tag — GitHub only
      # writes it when the release is published, which is the last thing this
      # workflow does. On a push event the default checkout is already the
      # commit release-please just released.
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Apple silicon and Intel targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset until there is an Apple Developer account; Tauri skips
          # signing and notarisation when the identity is empty.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: [prepare, bundle]
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # By id, not by tag: the tag does not exist until this call succeeds.
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false --jq '"published \(.tag_name) at \(.html_url)"'
